<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setlist — Alabanza & Adoración</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F0F1A; --surface: #1A1A2E; --surface2: #222240;
    --border: #2A2A42; --gold: #C9A84C; --gold-dim: #8a7030;
    --text: #F0EDE6; --text-dim: #9090a8;
    --adoracion: #7B68EE; --alabanza: #E07B4A; --green: #4CAF8A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 20px; text-align: center;
  }
  header h1 { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1rem; letter-spacing: 0.08em; }
  .setlist-info { margin-top: 6px; }
  .setlist-fecha { font-size: 0.95rem; font-weight: 500; }
  .setlist-tipo { display: inline-block; margin-top: 6px; font-size: 0.72rem; padding: 3px 12px; border-radius: 20px; background: rgba(201,168,76,0.15); color: var(--gold); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .setlist-notas { font-size: 0.8rem; color: var(--text-dim); margin-top: 4px; }

  .song-list { padding: 16px; max-width: 700px; margin: 0 auto; }

  .song-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 14px; overflow: hidden;
  }
  .song-header {
    padding: 14px 16px; display: flex; align-items: center;
    gap: 12px; cursor: pointer; border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }
  .song-header.open { border-bottom-color: var(--border); }
  .song-num { font-family: 'JetBrains Mono', monospace; color: var(--gold); font-size: 1rem; font-weight: 600; min-width: 24px; }
  .song-info { flex: 1; }
  .song-title { font-family: 'Cinzel', serif; font-size: 0.95rem; }
  .song-nickname { font-size: 0.78rem; color: var(--text-dim); font-style: italic; margin-top: 2px; }
  .song-meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .tone { font-family: 'JetBrains Mono', monospace; color: var(--gold); font-size: 0.85rem; font-weight: 500; }
  .badge { font-size: 0.68rem; font-weight: 600; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em; }
  .adoracion { background: rgba(123,104,238,0.2); color: var(--adoracion); }
  .alabanza { background: rgba(224,123,74,0.2); color: var(--alabanza); }
  .chevron { color: var(--text-dim); font-size: 1.2rem; transition: transform 0.2s; }
  .chevron.open { transform: rotate(180deg); }

  .song-body { display: none; padding: 14px 16px; }
  .song-body.open { display: block; }

  /* Transpose */
  .transpose-bar {
    display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
    background: var(--bg); border-radius: 8px; padding: 8px 12px;
  }
  .transpose-bar span { font-size: 0.78rem; color: var(--text-dim); flex: 1; }
  .t-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); width: 32px; height: 32px; border-radius: 6px;
    cursor: pointer; font-size: 0.95rem; font-family: 'JetBrains Mono', monospace;
    display: flex; align-items: center; justify-content: center;
  }
  .t-label { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--gold); min-width: 40px; text-align: center; }
  .t-reset { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.75rem; padding: 0 4px; }

  /* Chord sheet */
  .chord-sheet { font-family: 'JetBrains Mono', monospace; font-size: 0.88rem; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .cs-section { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); font-weight: 700; margin: 14px 0 4px; font-family: 'Inter', sans-serif; }
  .cs-chord-line { color: var(--gold); white-space: pre; line-height: 1.4; }
  .cs-lyric-line { color: var(--text); white-space: pre; line-height: 1.6; }
  .cs-blank { height: 10px; }

  .ref-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--gold); text-decoration: none; font-size: 0.8rem;
    background: rgba(201,168,76,0.1); border: 1px solid var(--gold-dim);
    padding: 6px 12px; border-radius: 8px; margin-top: 12px;
  }

  .loading {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  .loading h2 { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1rem; letter-spacing: 0.08em; }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error { text-align: center; padding: 48px 20px; color: var(--text-dim); }
  .error h2 { font-family: 'Cinzel', serif; color: var(--gold); margin-bottom: 12px; }
</style>
</head>
<body>

<div class="loading" id="loading">
  <h2>♩ Repertorio</h2>
  <div class="spinner"></div>
  <p style="font-size:0.8rem;color:var(--text-dim)">Cargando setlist…</p>
</div>

<div id="app" style="display:none">
  <header>
    <h1>♩ Alabanza & Adoración</h1>
    <div class="setlist-info">
      <div class="setlist-fecha" id="slFecha"></div>
      <span class="setlist-tipo" id="slTipo"></span>
      <div class="setlist-notas" id="slNotas"></div>
    </div>
  </header>
  <div class="song-list" id="songList"></div>
</div>

<script>
// ══ FIREBASE ══
const firebaseConfig = {
  apiKey: "AIzaSyD3oZLB_qwKw0yYyemOldjnJWj0bZz57jU",
  authDomain: "planilla-viajes-2026.firebaseapp.com",
  databaseURL: "https://planilla-viajes-2026-default-rtdb.firebaseio.com",
  projectId: "planilla-viajes-2026",
  storageBucket: "planilla-viajes-2026.firebasestorage.app",
  messagingSenderId: "943742793691",
  appId: "1:943742793691:web:f2c863b10deae4e20919fe"
};

const fbScript = document.createElement('script');
fbScript.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
fbScript.onload = () => {
  const dbScript = document.createElement('script');
  dbScript.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';
  dbScript.onload = () => {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    // Get setlist ID from URL param
    const params = new URLSearchParams(window.location.search);
    const slId = params.get('sl');
    if (!slId) { showError('No se especificó un setlist.'); return; }
    db.ref('repertorio').once('value', snap => {
      const data = snap.val() || {};
      const songs = Object.values(data.songs || {});
      const setlists = Object.values(data.setlists || {});
      const sl = setlists.find(x => x.id === slId);
      if (!sl) { showError('Setlist no encontrado.'); return; }
      renderSetlist(sl, songs);
    });
  };
  document.head.appendChild(dbScript);
};
document.head.appendChild(fbScript);

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('app').innerHTML = `<div class="error"><h2>♩</h2><p>${msg}</p></div>`;
}

function renderSetlist(sl, allSongs) {
  const slSongs = (sl.songs || []).map(id => allSongs.find(s => s.id === id)).filter(Boolean);
  const fecha = new Date(sl.fecha + 'T12:00:00').toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('slFecha').textContent = fecha.charAt(0).toUpperCase() + fecha.slice(1);
  document.getElementById('slTipo').textContent = sl.tipo;
  if (sl.notas) document.getElementById('slNotas').textContent = sl.notas;

  const list = document.getElementById('songList');
  const offsets = {};
  slSongs.forEach((s, i) => { offsets[s.id] = 0; });

  function renderSongs() {
    list.innerHTML = slSongs.map((s, i) => {
      const offset = offsets[s.id] || 0;
      const transposedTone = transposeText(s.tone || '', offset);
      return `<div class="song-card">
        <div class="song-header" id="hdr-${s.id}" onclick="toggleSong('${s.id}')">
          <div class="song-num">${i+1}</div>
          <div class="song-info">
            <div class="song-title">${s.title}</div>
            ${s.nickname ? `<div class="song-nickname">"${s.nickname}"</div>` : ''}
            <div class="song-meta">
              <span class="tone">🎵 ${transposedTone || '—'}</span>
              <span class="badge ${s.category}">${s.category === 'adoracion' ? 'Adoración' : 'Alabanza'}</span>
              ${offset !== 0 ? `<span style="font-size:0.7rem;background:rgba(201,168,76,0.15);color:var(--gold);padding:2px 8px;border-radius:10px">${offset > 0 ? '+' : ''}${offset} st</span>` : ''}
            </div>
          </div>
          <span class="chevron" id="chv-${s.id}">⌄</span>
        </div>
        <div class="song-body" id="body-${s.id}">
          ${s.chords ? `
          <div class="transpose-bar">
            <span>Transponer:</span>
            <button class="t-btn" onclick="transpose('${s.id}',-1);event.stopPropagation()">♭−</button>
            <span class="t-label">${offset === 0 ? 'orig' : (offset > 0 ? '+' : '') + offset + ' st'}</span>
            <button class="t-btn" onclick="transpose('${s.id}',+1);event.stopPropagation()">♯+</button>
            ${offset !== 0 ? `<button class="t-reset" onclick="transpose('${s.id}',${-offset});event.stopPropagation()">↺ orig</button>` : ''}
          </div>
          <div class="chord-sheet">${renderChordSheet(transposeText(s.chords, offset))}</div>` : '<p style="font-size:0.8rem;color:var(--text-dim)">Sin acordes cargados.</p>'}
          ${s.link ? `<a href="${s.link}" target="_blank" class="ref-link">▶ Ver referencia</a>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  window.toggleSong = (id) => {
    const body = document.getElementById('body-' + id);
    const hdr = document.getElementById('hdr-' + id);
    const chv = document.getElementById('chv-' + id);
    const isOpen = body.classList.contains('open');
    body.classList.toggle('open', !isOpen);
    hdr.classList.toggle('open', !isOpen);
    chv.classList.toggle('open', !isOpen);
    if (!isOpen) {
      document.fonts.ready.then(() => {
        const cs = document.querySelector(`#body-${id} .chord-sheet`);
        if (cs && offsets[id] !== undefined) {
          const s = slSongs.find(x => x.id === id);
          if (s && s.chords) cs.innerHTML = renderChordSheet(transposeText(s.chords, offsets[id]));
        }
      });
    }
  };

  window.transpose = (id, steps) => {
    offsets[id] = ((offsets[id] || 0) + steps + 12) % 12;
    if (offsets[id] > 6) offsets[id] -= 12;
    renderSongs();
    // Reopen if was open
    const body = document.getElementById('body-' + id);
    if (body) {
      body.classList.add('open');
      document.getElementById('hdr-' + id).classList.add('open');
      document.getElementById('chv-' + id).classList.add('open');
    }
  };

  renderSongs();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

// ══ TRANSPOSE ENGINE ══
const CHROMATIC = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const ENHARMONIC = {'Db':'C#','Eb':'D#','Fb':'E','Gb':'F#','Ab':'G#','Bb':'A#','Cb':'B'};
function noteIndex(n) { return CHROMATIC.indexOf(ENHARMONIC[n] || n); }
function transposeNote(n, s) { const i = noteIndex(n); return i === -1 ? n : CHROMATIC[((i+s)%12+12)%12]; }
function transposeChordToken(t, s) {
  const m = t.match(/^([A-G][b#]?)(.*)$/);
  if (!m) return t;
  const q = m[2].replace(/\/([A-G][b#]?)/, (_,b) => '/'+transposeNote(b,s));
  return transposeNote(m[1],s)+q;
}
function transposeText(text, steps) {
  if (!text || steps === 0) return text;
  return text.replace(/\b([A-G][b#]?(?:maj|min|m|M|sus|aug|dim|add|[0-9]|\/[A-G][b#]?)*)\b/g, t => transposeChordToken(t, steps));
}

// ══ CHORD SHEET RENDERER ══
function isChordLine(line) {
  const t = line.trim(); if (!t) return false;
  const c = (t.match(/\b[A-G][b#]?(?:maj\d*|min\d*|m\d*|M\d*|sus\d*|aug\d*|dim\d*|add\d*|\d+|\/[A-G][b#]?)*\b/g)||[]).length;
  const w = t.replace(/\b[A-G][b#]?(?:maj\d*|min\d*|m\d*|M\d*|sus\d*|aug\d*|dim\d*|add\d*|\d+|\/[A-G][b#]?)*\b/g,'').trim();
  return c >= 1 && w.length < t.length * 0.45;
}
function isSectionLabel(line) {
  return /^(INTRO|CORO|ESTROFA|PUENTE|VERSO|BRIDGE|PRE-CORO|FINAL|OUTRO|INTERLUDIO|Introducción)/i.test(line.trim()) && line.trim().length < 40;
}
function renderChordSheet(text) {
  if (!text) return '';
  return text.split('\n').map(line => {
    if (!line.trim()) return '<div class="cs-blank"></div>';
    if (isSectionLabel(line)) return `<div class="cs-section">${line.trim()}</div>`;
    if (isChordLine(line)) return `<div class="cs-chord-line">${line.replace(/\b([A-G][b#]?(?:maj\d*|min\d*|m\d*|sus\d*|aug\d*|dim\d*|add\d*|\d+|\/[A-G][b#]?)*)\b/g,'<span style="color:var(--gold);font-weight:700">$1</span>')}</div>`;
    return `<div class="cs-lyric-line">${line.replace(/</g,'&lt;')}</div>`;
  }).join('');
}
</script>
</body>
</html>
