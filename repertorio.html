<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repertorio — Alabanza & Adoración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F0F1A;
    --surface: #1A1A2E;
    --surface2: #222240;
    --border: #2A2A42;
    --gold: #C9A84C;
    --gold-dim: #8a7030;
    --text: #F0EDE6;
    --text-dim: #9090a8;
    --adoracion: #7B68EE;
    --alabanza: #E07B4A;
    --green: #4CAF8A;
    --red: #E05555;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    font-size: 15px;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    color: var(--gold);
    letter-spacing: 0.08em;
  }
  header span {
    font-size: 0.75rem;
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    letter-spacing: 0.05em;
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 53px;
    z-index: 99;
  }
  .tab {
    flex: 1;
    padding: 12px 8px;
    text-align: center;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .tab.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  /* ── VIEWS ── */
  .view { display: none; padding: 16px; max-width: 800px; margin: 0 auto; }
  .view.active { display: block; }

  /* ── SEARCH & FILTER BAR ── */
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .search-wrap {
    flex: 1;
    position: relative;
    min-width: 160px;
  }
  .search-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px 9px 36px;
    border-radius: 8px;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--gold-dim); }
  .search-wrap svg {
    position: absolute;
    left: 10px; top: 50%;
    transform: translateY(-50%);
    opacity: 0.4;
  }
  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    white-space: nowrap;
  }
  .filter-btn.active { border-color: var(--gold); color: var(--gold); }
  .btn-primary {
    background: var(--gold);
    color: #0F0F1A;
    border: none;
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .btn-primary:hover { opacity: 0.88; }

  /* ── SONG CARDS ── */
  .song-list { display: flex; flex-direction: column; gap: 10px; }
  .song-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }
  .song-card:hover { border-color: var(--gold-dim); background: var(--surface2); }
  .song-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .song-title {
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }
  .song-meta {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 6px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .badge-adoracion { background: rgba(123,104,238,0.2); color: var(--adoracion); }
  .badge-alabanza  { background: rgba(224,123,74,0.2);  color: var(--alabanza); }
  .tone-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    color: var(--gold);
    font-weight: 500;
  }
  .song-notes-preview {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 6px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .song-last-used {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .wave-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .wave-adoracion { background: rgba(123,104,238,0.15); }
  .wave-alabanza  { background: rgba(224,123,74,0.15); }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    overflow-y: auto;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 560px;
    padding: 24px;
    margin: auto;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .modal-title {
    font-family: 'Cinzel', serif;
    font-size: 1.05rem;
    color: var(--gold);
  }
  .modal-close {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1.4rem;
    line-height: 1;
    padding: 4px;
  }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 500;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--gold-dim); }
  .form-group select option { background: #1A1A2E; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .btn-secondary {
    background: var(--surface2);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
  }

  /* ── SONG DETAIL ── */
  .detail-section {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .detail-section-title {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .chords-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88rem;
    color: var(--gold);
    line-height: 1.8;
    white-space: pre-wrap;
  }

  /* ── CHORD SHEET FORMAT ── */
  .chord-sheet { font-family: 'JetBrains Mono', monospace; font-size: 0.88rem; line-height: 1; }
  .cs-section-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    font-weight: 700;
    margin: 14px 0 6px;
    font-family: 'Inter', sans-serif;
  }
  .cs-line { display: flex; flex-direction: column; margin-bottom: 2px; }
  .cs-chords {
    color: var(--gold);
    font-weight: 500;
    font-size: 0.85rem;
    letter-spacing: 0.03em;
    white-space: pre;
    line-height: 1.4;
  }
  .cs-lyric {
    color: var(--text);
    font-size: 0.88rem;
    white-space: pre;
    line-height: 1.5;
    font-family: 'Inter', sans-serif;
  }
  .cs-lyric-only {
    color: var(--text);
    font-size: 0.88rem;
    white-space: pre;
    line-height: 1.6;
    font-family: 'Inter', sans-serif;
  }

  /* ── INLINE CHORD EDIT ── */
  .chord-edit-area {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    padding: 10px 12px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    line-height: 1.8;
    resize: vertical;
    min-height: 120px;
    outline: none;
  }

  /* ── PRINT ── */
  @media print {
    header, .tabs, .toolbar, .modal-overlay:not(.printing),
    .modal-actions, .add-note-area, #notesList,
    .detail-section:last-child { display: none !important; }
    body { background: #fff !important; color: #000 !important; }
    .print-area { display: block !important; }
    .cs-chords { color: #b8860b !important; }
    .cs-lyric, .cs-lyric-only { color: #000 !important; }
    .cs-section-label { color: #555 !important; }
    .print-title { font-family: 'Cinzel', serif; font-size: 1.3rem; margin-bottom: 4px; }
    .print-meta { font-size: 0.8rem; color: #555; margin-bottom: 16px; }
  }
  #printArea { display: none; }
  .history-list { list-style: none; }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.83rem;
  }
  .history-item:last-child { border-bottom: none; }
  .history-type {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  .type-servicio { background: rgba(201,168,76,0.15); color: var(--gold); }
  .type-ensayo   { background: rgba(76,175,138,0.15);  color: var(--green); }
  .notes-list { list-style: none; }
  .note-item {
    padding: 8px 10px;
    background: var(--surface2);
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 0.83rem;
    line-height: 1.5;
  }
  .note-date {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .add-note-area {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .add-note-area input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-family: 'Inter', sans-serif;
    outline: none;
  }
  .add-note-area input:focus { border-color: var(--gold-dim); }
  .btn-icon {
    background: var(--gold);
    color: #0F0F1A;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* ── SETLISTS ── */
  .setlist-grid { display: flex; flex-direction: column; gap: 12px; }
  .setlist-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .setlist-header {
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  .setlist-date {
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    color: var(--gold);
  }
  .setlist-body { padding: 12px 16px; }
  .setlist-songs { list-style: none; }
  .setlist-song-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
    gap: 8px;
  }
  .setlist-song-item:last-child { border-bottom: none; }
  .setlist-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
    min-width: 20px;
  }
  .sl-song-name { flex: 1; }
  .sl-tone {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--gold);
  }

  /* ── HISTORIAL ── */
  .history-timeline { display: flex; flex-direction: column; gap: 10px; }
  .history-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .history-block-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-dim);
  }
  .empty-state svg { margin-bottom: 16px; opacity: 0.3; }
  .empty-state h3 {
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .empty-state p { font-size: 0.82rem; line-height: 1.5; }

  /* ── TONE VARIANTS ── */
  .tone-variant-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .tone-variant-row input {
    flex: 1;
    min-width: 80px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 0.85rem;
    font-family: 'JetBrains Mono', monospace;
    outline: none;
  }
  .tone-variant-row input:focus { border-color: var(--gold-dim); }
  .remove-btn {
    background: none;
    border: none;
    color: var(--red);
    cursor: pointer;
    font-size: 1.1rem;
    padding: 0 4px;
  }
  .add-variant-btn {
    background: none;
    border: 1px dashed var(--border);
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.78rem;
    cursor: pointer;
    transition: border-color 0.2s;
    margin-top: 4px;
  }
  .add-variant-btn:hover { border-color: var(--gold-dim); color: var(--gold); }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 16px 0;
  }
  .count-badge {
    background: var(--surface2);
    color: var(--text-dim);
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
  }
</style>
</head>
<body>

<div id="loadingOverlay" style="position:fixed;inset:0;background:#0F0F1A;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
  <div style="font-family:'Cinzel',serif;color:#C9A84C;font-size:1.1rem;letter-spacing:0.08em">♩ Repertorio</div>
  <div style="color:#9090a8;font-size:0.85rem">Cargando canciones…</div>
  <div style="width:40px;height:40px;border:3px solid #2A2A42;border-top-color:#C9A84C;border-radius:50%;animation:spin 0.8s linear infinite"></div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<header>
  <h1>♩ Repertorio</h1>
  <div style="display:flex;align-items:center;gap:12px">
    <span>Alabanza &amp; Adoración</span>
    <button id="adminBtn" onclick="promptAdmin()" style="background:none;border:none;cursor:pointer;font-size:0.8rem;color:var(--text-dim);padding:4px 8px;border-radius:6px">🔒 Admin</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" data-tab="canciones">Canciones</div>
  <div class="tab" data-tab="setlists">Setlists</div>
  <div class="tab" data-tab="historial">Historial</div>
</div>

<!-- ══ CANCIONES ══ -->
<div class="view active" id="view-canciones">
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar canción…">
    </div>
    <button class="filter-btn active" data-filter="todas">Todas</button>
    <button class="filter-btn" data-filter="adoracion">Adoración</button>
    <button class="filter-btn" data-filter="alabanza">Alabanza</button>
    <button class="btn-primary admin-only" id="btnNuevaCancion">+ Nueva</button>
  </div>
  <div class="song-list" id="songList"></div>
</div>

<!-- ══ SETLISTS ══ -->
<div class="view" id="view-setlists">
  <div class="toolbar">
    <button class="btn-secondary admin-only" id="btnShareSetlist" style="margin-left:0">📤 Compartir por WhatsApp</button>
    <button class="btn-primary admin-only" id="btnNuevoSetlist" style="margin-left:auto">+ Nuevo Setlist</button>
  </div>
  <div class="setlist-grid" id="setlistGrid"></div>
</div>

<!-- ══ HISTORIAL ══ -->
<div class="view" id="view-historial">
  <div class="history-timeline" id="historialList"></div>
</div>

<!-- ══ MODAL: CANCIÓN FORM ══ -->
<div class="modal-overlay" id="modalSongForm">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalSongTitle">Nueva Canción</span>
      <button class="modal-close" id="closeSongForm">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Título oficial</label>
        <input type="text" id="fTitle" placeholder="Nombre formal de la canción">
      </div>
      <div class="form-group">
        <label>Nombre popular <span style="font-weight:300;text-transform:none;letter-spacing:0">(cómo la conocemos)</span></label>
        <input type="text" id="fNickname" placeholder="Ej: La del coro de gracia…">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Categoría</label>
        <select id="fCategory">
          <option value="adoracion">Adoración</option>
          <option value="alabanza">Alabanza</option>
        </select>
      </div>
      <div class="form-group">
        <label>Temática</label>
        <input type="text" id="fTheme" placeholder="Ej: Gracia, Santidad…">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Tonalidad general</label>
        <input type="text" id="fTone" placeholder="Ej: Sol M, Re m…" style="font-family:'JetBrains Mono',monospace">
      </div>
      <div class="form-group">
        <label>Link de referencia</label>
        <input type="url" id="fLink" placeholder="https://youtube.com/…">
      </div>
    </div>
    <div class="form-group">
      <label>Tonalidades por cantante</label>
      <div id="toneVariants"></div>
      <button class="add-variant-btn" id="btnAddVariant">+ Agregar variante</button>
    </div>
    <div class="form-group">
      <label>Progresión / Acordes</label>
      <textarea id="fChords" placeholder="Ej: Intro: Sol Re La Mi&#10;Estrofa: Sol Re Fa# Mi&#10;Coro: Do Re Sol"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelSongForm">Cancelar</button>
      <button class="btn-primary" id="saveSongForm">Guardar</button>
    </div>
  </div>
</div>

<!-- ══ MODAL: DETALLE CANCIÓN ══ -->
<div class="modal-overlay" id="modalSongDetail">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <span class="modal-title" id="detailTitle"></span>
      <button class="modal-close" id="closeSongDetail">✕</button>
    </div>
    <div id="detailBody"></div>
    <div class="modal-actions">
      <button class="btn-secondary admin-only" id="detailEditBtn">✏ Editar</button>

// ══ TRANSPOSER ════════════════════════════════════════════
const CHROMATIC = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const ENHARMONIC = { 'Db':'C#','Eb':'D#','Fb':'E','Gb':'F#','Ab':'G#','Bb':'A#','Cb':'B' };

function noteIndex(note) {
  const n = ENHARMONIC[note] || note;
  return CHROMATIC.indexOf(n);
}

function transposeNote(note, steps) {
  const idx = noteIndex(note);
  if (idx === -1) return note;
  return CHROMATIC[((idx + steps) % 12 + 12) % 12];
}

function transposeChordToken(token, steps) {
  // Match chord root like C, C#, Db, followed by optional quality (m, maj7, sus4, etc.)
  const match = token.match(/^([A-G][b#]?)(.*)$/);
  if (!match) return token;
  const root = transposeNote(match[1], steps);
  // Handle slash chords bass note e.g. G/B
  const quality = match[2].replace(/\/([A-G][b#]?)/, (_, bass) => '/' + transposeNote(bass, steps));
  return root + quality;
}

function transposeText(text, steps) {
  if (!text || steps === 0) return text;
  // Replace chord tokens — words starting with A-G
  return text.replace(/\b([A-G][b#]?(?:maj|min|m|M|sus|aug|dim|add|[0-9]|\/[A-G][b#]?)*)/g, token => {
    return transposeChordToken(token, steps);
  });
}

// ══ CHORD SHEET RENDERER ══════════════════════════════════
// Format: lines starting with chord tokens (A-G) are chord lines,
// section headers are ALL CAPS words alone (CORO, PUENTE, ESTROFA, INTRO...)
// Everything else is lyric lines.
function isChordLine(line) {
  const trimmed = line.trim();
  if (!trimmed) return false;
  const chordCount = (trimmed.match(/\b[A-G][b#]?(?:maj\d*|min\d*|m\d*|M\d*|sus\d*|aug\d*|dim\d*|add\d*|\d+|\/[A-G][b#]?)*\b/g) || []).length;
  const withoutChords = trimmed.replace(/\b[A-G][b#]?(?:maj\d*|min\d*|m\d*|M\d*|sus\d*|aug\d*|dim\d*|add\d*|\d+|\/[A-G][b#]?)*\b/g, '').trim();
  return chordCount >= 1 && withoutChords.length < trimmed.length * 0.45;
}

function isSectionLabel(line) {
  return /^(INTRO|CORO|ESTROFA|PUENTE|VERSO|BRIDGE|PRE-CORO|FINAL|OUTRO|INTERLUDIO|Introducción)/i.test(line.trim()) && line.trim().length < 40;
}

// Canvas-based text measurer — waits for font to load
let _canvas, _ctx;
function measurePx(str, fontSize) {
  if (!_canvas) { _canvas = document.createElement('canvas'); _ctx = _canvas.getContext('2d'); }
  _ctx.font = `${fontSize}px 'JetBrains Mono'`;
  return _ctx.measureText(str).width;
}

function buildChordPairDOM(chordLine, lyricLine, fontSize) {
  const re = /([A-G][b#]?(?:maj\d*|min\d*|m\d*|M\d*|sus\d*|aug\d*|dim\d*|add\d*|\d+|\/[A-G][b#]?)*)/g;
  let m;
  const chords = [];
  while ((m = re.exec(chordLine)) !== null) chords.push({ chord: m[1], charPos: m.index });

  const block = document.createElement('div');
  block.style.cssText = 'position:relative;margin-bottom:2px';

  const chordRow = document.createElement('div');
  chordRow.style.cssText = `position:relative;height:${fontSize * 1.5}px`;

  for (const { chord, charPos } of chords) {
    const px = measurePx(chordLine.slice(0, charPos), fontSize);
    const span = document.createElement('span');
    span.style.cssText = `position:absolute;left:${px}px;top:0;color:var(--gold);font-weight:700;font-size:${fontSize}px;font-family:'JetBrains Mono',monospace;white-space:nowrap`;
    span.textContent = chord;
    chordRow.appendChild(span);
  }

  const lyricRow = document.createElement('div');
  lyricRow.style.cssText = `font-size:${fontSize}px;line-height:1.55;color:var(--text);font-family:'JetBrains Mono',monospace;white-space:nowrap`;
  lyricRow.textContent = lyricLine || '';

  block.appendChild(chordRow);
  block.appendChild(lyricRow);
  return block;
}

function renderChordSheetDOM(text, container) {
  container.innerHTML = '';
  if (!text) return;
  const fontSize = 13;
  const lines = text.split('\n');
  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px';
  const inner = document.createElement('div');
  inner.style.cssText = 'display:inline-block;min-width:100%';

  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) {
      const sp = document.createElement('div');
      sp.style.height = '10px';
      inner.appendChild(sp);
      i++;
    } else if (isSectionLabel(line)) {
      const div = document.createElement('div');
      div.style.cssText = 'font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-dim);font-weight:700;margin:14px 0 4px;font-family:Inter,sans-serif';
      div.textContent = line.trim();
      inner.appendChild(div);
      i++;
    } else if (isChordLine(line)) {
      const nextLine = (i+1 < lines.length && lines[i+1].trim() && !isChordLine(lines[i+1]) && !isSectionLabel(lines[i+1])) ? lines[i+1] : '';
      inner.appendChild(buildChordPairDOM(line, nextLine, fontSize));
      i += nextLine ? 2 : 1;
    } else {
      const div = document.createElement('div');
      div.style.cssText = `font-size:${fontSize}px;line-height:1.6;color:var(--text);font-family:'JetBrains Mono',monospace;white-space:nowrap`;
      div.textContent = line;
      inner.appendChild(div);
      i++;
    }
  }
  wrapper.appendChild(inner);
  container.appendChild(wrapper);
}

// Wrapper that waits for font then renders into DOM directly
function renderChordSheet(text) {
  // Return placeholder; actual render happens via renderChordSheetInto
  return `<div id="csPlaceholder" style="color:var(--text-dim);font-size:0.8rem">Cargando…</div>`;
}

function renderChordSheetInto(text, containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  document.fonts.ready.then(() => renderChordSheetDOM(text, el));
}

let currentSlId = null;

  const fecha = $('slFecha').value;
  if (!fecha) return;
  if (currentSlId) {
    const sl = setlists.find(x => x.id === currentSlId);
    if (sl) {
      sl.songs = [...slSelectedIds];
      sl.notas = $('slNotas').value.trim();

function renderHistorial() {
  const list = $('historialList');
  const all = [];
  songs.forEach(s => {
    (s.history || []).forEach(h => all.push({ ...h, songTitle: s.title, songId: s.id, category: s.category }));
  });
  all.sort((a, b) => b.fecha.localeCompare(a.fecha));

  if (!all.length) {
    list.innerHTML = `<div class="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <h3>Sin historial</h3>
      <p>El historial de uso de las canciones aparecerá acá.</p>
    </div>`;
    return;
  }

  // Group by date
  const grouped = {};
  all.forEach(h => { if (!grouped[h.fecha]) grouped[h.fecha] = []; grouped[h.fecha].push(h); });

  list.innerHTML = Object.entries(grouped).map(([fecha, items]) => `
    <div class="history-block">
      <div class="history-block-header">
        <span style="font-family:'Cinzel',serif;font-size:0.88rem;color:var(--gold)">${dateStr(fecha)}</span>
        <span class="history-type type-${items[0].tipo}">${items[0].tipo}</span>
      </div>
      ${items.map(h => `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:0.83rem">
        <span>${h.songTitle}</span>
        <span class="badge badge-${h.category}" style="font-size:0.65rem">${h.category === 'adoracion' ? 'Ador.' : 'Alab.'}</span>
      </div>`).join('')}
    </div>`).join('');
}

// ══ MODAL HELPERS ══════════════════════════════════════════
function openModal(id) { $(id).classList.add('open'); }
function closeModal(id) { $(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

// ══ INIT — Firebase carga los datos y llama renderSongs/renderSetlists
showLoading(true);
checkAdmin();
</script>
</body>
</html>
